services:
  imajev-api:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    image: imajev-api:cuda
    container_name: imajev-api-cuda
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: 8gb
    ports:
      - "${IMAJEV_PORT:-8765}:8765"
    environment:
      IMAJEV_API_KEY: "${IMAJEV_API_KEY:?Set IMAJEV_API_KEY in .env}"
      IMAJEV_MODEL_REPO: "${IMAJEV_MODEL_REPO:-mohit67890/imajev-4b}"
      IMAJEV_MODEL_REVISION: "${IMAJEV_MODEL_REVISION:-c9e5f132465da85d31735ec502d5557982671a7d}"
      IMAJEV_BASE_REPO: "${IMAJEV_BASE_REPO:-Qwen/Qwen3.5-4B}"
      IMAJEV_BASE_REVISION: "${IMAJEV_BASE_REVISION:-851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a}"
      IMAJEV_ROTATIONS: "${IMAJEV_ROTATIONS:-1}"
      IMAJEV_CALIBRATION: "${IMAJEV_CALIBRATION:-calibration.json}"
      IMAJEV_MAX_INPUT_TOKENS: "${IMAJEV_MAX_INPUT_TOKENS:-4096}"
      IMAJEV_FAST: "${IMAJEV_FAST:-0}"
      IMAJEV_PORT: "8765"
    volumes:
      - imajev-models:/models

volumes:
  imajev-models:
